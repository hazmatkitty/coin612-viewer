[package]
name = "coin612-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
rusb = "0.9"
triple_buffer = "8"
png = "0.17"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
anyhow = "1"

[target.'cfg(not(windows))'.dependencies]
sdl2 = { version = "0.37", features = ["use-pkgconfig"] }

# Windows has no pkg-config; build SDL2 from source and link it statically
# (requires CMake and a C compiler, e.g. MSVC Build Tools).
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
