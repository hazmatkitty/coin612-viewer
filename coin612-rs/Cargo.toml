[package]
name = "coin612-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
rusb = "0.9"
sdl2 = { version = "0.37", features = ["use-pkgconfig"] }
triple_buffer = "8"
png = "0.17"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
